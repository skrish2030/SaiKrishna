<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">SREAgent architecture</title><desc id="desc">Monitoring tools and custom webhooks send alerts to secure intake, then normalization and deduplication, contextual correlation, operational command center, and Microsoft Teams notifications.</desc>
<defs>
  <linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2867c9"/><stop offset="1" stop-color="#2ca9d9"/></linearGradient>
  <linearGradient id="t" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1696a2"/><stop offset="1" stop-color="#46d7c8"/></linearGradient>
  <filter id="s"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-opacity=".25"/></filter>
</defs>
<rect width="1200" height="520" rx="24" fill="#071523"/>
<g font-family="Arial, sans-serif" fill="#eaf5fc">
  <text x="600" y="42" text-anchor="middle" font-size="23" font-weight="700">Platform Watch Tower / SREAgent — Non-confidential Architecture</text>
  <text x="600" y="70" text-anchor="middle" font-size="13" fill="#8ea7b8">Signals → secure intake → intelligence → operational action</text>

  <g filter="url(#s)">
    <rect x="35" y="115" width="170" height="290" rx="18" fill="#0d2438" stroke="#29506d"/>
    <text x="120" y="147" text-anchor="middle" font-size="15" font-weight="700">Signal Sources</text>
    <g font-size="13" fill="#bcd0dc">
      <rect x="58" y="170" width="124" height="34" rx="8" fill="#112f48"/><text x="120" y="192" text-anchor="middle">Grafana</text>
      <rect x="58" y="215" width="124" height="34" rx="8" fill="#112f48"/><text x="120" y="237" text-anchor="middle">OpenSearch</text>
      <rect x="58" y="260" width="124" height="34" rx="8" fill="#112f48"/><text x="120" y="282" text-anchor="middle">Cloud / APM</text>
      <rect x="58" y="305" width="124" height="34" rx="8" fill="#112f48"/><text x="120" y="327" text-anchor="middle">Databases</text>
      <rect x="58" y="350" width="124" height="34" rx="8" fill="#112f48"/><text x="120" y="372" text-anchor="middle">Custom Webhooks</text>
    </g>

    <rect x="255" y="160" width="170" height="200" rx="18" fill="url(#b)"/>
    <text x="340" y="198" text-anchor="middle" font-size="16" font-weight="700">Secure Intake</text>
    <g font-size="13" fill="#eaf5fc">
      <text x="340" y="230" text-anchor="middle">Bearer / shared secret</text>
      <text x="340" y="256" text-anchor="middle">Plugin-style adapters</text>
      <text x="340" y="282" text-anchor="middle">Schema validation</text>
      <text x="340" y="308" text-anchor="middle">Delivery tracking</text>
    </g>

    <rect x="475" y="115" width="210" height="290" rx="18" fill="#102b43" stroke="#2a688e"/>
    <text x="580" y="149" text-anchor="middle" font-size="16" font-weight="700">Alert Intelligence</text>
    <g font-size="13" fill="#bed2df">
      <rect x="500" y="173" width="160" height="38" rx="8" fill="#173a58"/><text x="580" y="197" text-anchor="middle">Normalize</text>
      <rect x="500" y="223" width="160" height="38" rx="8" fill="#173a58"/><text x="580" y="247" text-anchor="middle">Deduplicate / suppress</text>
      <rect x="500" y="273" width="160" height="38" rx="8" fill="#173a58"/><text x="580" y="297" text-anchor="middle">Classify severity</text>
      <rect x="500" y="323" width="160" height="38" rx="8" fill="#173a58"/><text x="580" y="347" text-anchor="middle">Route by ownership</text>
    </g>

    <rect x="735" y="115" width="220" height="290" rx="18" fill="url(#t)"/>
    <text x="845" y="149" text-anchor="middle" font-size="16" font-weight="700" fill="#03161a">Context Correlation</text>
    <g font-size="13" fill="#042128">
      <rect x="760" y="173" width="170" height="38" rx="8" fill="#74e7dc"/><text x="845" y="197" text-anchor="middle">Service / website health</text>
      <rect x="760" y="223" width="170" height="38" rx="8" fill="#74e7dc"/><text x="845" y="247" text-anchor="middle">Database posture</text>
      <rect x="760" y="273" width="170" height="38" rx="8" fill="#74e7dc"/><text x="845" y="297" text-anchor="middle">Release activity</text>
      <rect x="760" y="323" width="170" height="38" rx="8" fill="#74e7dc"/><text x="845" y="347" text-anchor="middle">Incident history</text>
    </g>

    <rect x="1005" y="115" width="160" height="125" rx="18" fill="#112f48" stroke="#327aa4"/>
    <text x="1085" y="150" text-anchor="middle" font-size="15" font-weight="700">Command Center</text>
    <text x="1085" y="179" text-anchor="middle" font-size="12" fill="#bdd0dc">Unified health</text>
    <text x="1085" y="201" text-anchor="middle" font-size="12" fill="#bdd0dc">Actionable context</text>

    <rect x="1005" y="280" width="160" height="125" rx="18" fill="#153a39" stroke="#42d6ce"/>
    <text x="1085" y="315" text-anchor="middle" font-size="15" font-weight="700">Notifications</text>
    <text x="1085" y="344" text-anchor="middle" font-size="12" fill="#c6ddd9">Microsoft Teams</text>
    <text x="1085" y="366" text-anchor="middle" font-size="12" fill="#c6ddd9">Operational updates</text>
  </g>

  <g stroke="#4da6ff" stroke-width="3" fill="none" opacity=".8">
    <path d="M205 260 H255"/><path d="M425 260 H475"/><path d="M685 260 H735"/><path d="M955 180 H1005"/><path d="M955 338 H1005"/>
  </g>
  <g fill="#42d6ce"><path d="M246 254 l10 6 -10 6z"/><path d="M466 254 l10 6 -10 6z"/><path d="M726 254 l10 6 -10 6z"/><path d="M996 174 l10 6 -10 6z"/><path d="M996 332 l10 6 -10 6z"/></g>
  <text x="600" y="468" text-anchor="middle" font-size="14" fill="#93a9b8">Designed to reduce fragmented monitoring, improve alert quality, and accelerate service-impact assessment.</text>
</g>
</svg>
