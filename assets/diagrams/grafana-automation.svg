<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
<title id="title">Grafana monitoring automation workflow</title><desc id="desc">A scheduled runner starts Playwright dashboard capture, historical comparison, rule-based analysis, visual report generation, S3 publishing, and Microsoft Teams notification.</desc>
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2869d0"/><stop offset="1" stop-color="#42d6ce"/></linearGradient></defs>
<rect width="1200" height="390" rx="24" fill="#071523"/>
<g font-family="Arial, sans-serif">
<text x="600" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#edf7ff">Grafana Monitoring Automation</text>
<text x="600" y="68" text-anchor="middle" font-size="13" fill="#93a9b8">Scheduled evidence capture, contextual analysis, and team-ready operational reporting</text>
<g transform="translate(38 125)">
  <g fill="#102b43" stroke="#2e668b">
    <rect x="0" y="0" width="150" height="110" rx="16"/><rect x="185" y="0" width="150" height="110" rx="16"/><rect x="370" y="0" width="150" height="110" rx="16"/><rect x="555" y="0" width="150" height="110" rx="16"/><rect x="740" y="0" width="150" height="110" rx="16"/><rect x="925" y="0" width="150" height="110" rx="16"/>
  </g>
  <g fill="#eaf5fc" text-anchor="middle">
    <text x="75" y="42" font-size="15" font-weight="700">Scheduled Runner</text><text x="75" y="70" font-size="12" fill="#a9bdca">PowerShell / Task</text>
    <text x="260" y="42" font-size="15" font-weight="700">Capture</text><text x="260" y="70" font-size="12" fill="#a9bdca">Python + Playwright</text>
    <text x="445" y="42" font-size="15" font-weight="700">Baseline</text><text x="445" y="70" font-size="12" fill="#a9bdca">Historical JSONL</text>
    <text x="630" y="42" font-size="15" font-weight="700">Analyze</text><text x="630" y="70" font-size="12" fill="#a9bdca">Rules + anomalies</text>
    <text x="815" y="42" font-size="15" font-weight="700">Publish</text><text x="815" y="70" font-size="12" fill="#a9bdca">Report + S3 link</text>
    <text x="1000" y="42" font-size="15" font-weight="700">Notify</text><text x="1000" y="70" font-size="12" fill="#a9bdca">Microsoft Teams</text>
  </g>
  <g stroke="url(#g)" stroke-width="4"><path d="M150 55 H185"/><path d="M335 55 H370"/><path d="M520 55 H555"/><path d="M705 55 H740"/><path d="M890 55 H925"/></g>
  <g fill="#42d6ce"><path d="M176 48 l10 7 -10 7z"/><path d="M361 48 l10 7 -10 7z"/><path d="M546 48 l10 7 -10 7z"/><path d="M731 48 l10 7 -10 7z"/><path d="M916 48 l10 7 -10 7z"/></g>
</g>
<text x="600" y="302" text-anchor="middle" font-size="14" fill="#bdd0db">Retention cleanup • visual report composition • short-lived sharing links • execution logs</text>
<rect x="365" y="327" width="470" height="32" rx="16" fill="#0e2b3f" stroke="#2d6f92"/><text x="600" y="348" text-anchor="middle" font-size="13" font-weight="700" fill="#42d6ce">Outcome: repeatable monitoring with clearer context and less manual dashboard review</text>
</g>
</svg>
